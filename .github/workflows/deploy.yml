name: Deploy Theme to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      priority:
        description: 'Which priority tier to deploy (0-4, or "all")'
        required: true
        default: '0'
        type: choice
        options:
          - 'all'
          - '0'
          - '1'
          - '2'
          - '3'
          - '4'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Materialize site registry
        run: |
          cat << 'EOF' > site-registry.json
          ${{ secrets.SITE_REGISTRY_JSON }}
          EOF

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to all matching sites
        env:
          PRIORITY: ${{ github.event.inputs.priority || '0' }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SITE_PATH: ${{ secrets.SITE_PATH }}
          THEME_SLUG: ${{ secrets.THEME_SLUG }}
        run: |
          echo "Filtering for priority: $PRIORITY"

          if [ "$PRIORITY" = "all" ]; then
            FILTER='[.[] | select(.ssh_setup == "Yes" and .site_path != null)]'
          else
            FILTER="[.[] | select(.ssh_setup == \"Yes\" and .site_path != null and .priority == $PRIORITY)]"
          fi

          COUNT=$(jq "$FILTER | length" site-registry.json)
          echo "Will deploy to $COUNT sites"

          FAILED=0
          while IFS= read -r SITE; do
            SITE_PATH_CODE=$(echo "$SITE" | jq -r '.site_path')
            SITE_NAME=$(echo "$SITE" | jq -r '.name')
            FULL_USER="${SSH_USER}_${SITE_PATH_CODE}"
            FULL_PATH="${SITE_PATH}/${SITE_PATH_CODE}/public_html"

            echo "::group::Deploying to $SITE_NAME ($SITE_PATH_CODE)"
            echo "user: $FULL_USER"
            echo "path: $FULL_PATH"

            if rsync -avz --delete \
              -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='.gitignore' \
              --exclude='node_modules' \
              --exclude='site-registry.json' \
              ./ "${FULL_USER}@${SSH_HOST}:${FULL_PATH}/wp-content/themes/${THEME_SLUG}/"; then
              ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" \
                -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                "${FULL_USER}@${SSH_HOST}" \
                "wp cache flush --path=${FULL_PATH} 2>&1 || true"
              echo "✓ $SITE_NAME deployed"
            else
              echo "✗ $SITE_NAME FAILED"
              FAILED=$((FAILED + 1))
            fi
            echo "::endgroup::"
          done < <(jq -c "$FILTER" site-registry.json | jq -c '.[]')

          echo ""
          echo "=== Summary ==="
          echo "Total: $COUNT, Failed: $FAILED"
          if [ "$FAILED" -gt 0 ]; then
            exit 1
          fi